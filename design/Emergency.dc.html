<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ventra — Emergency countdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#B83A26}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
[data-statusbar]{display:none}
@media (min-width:560px) and (min-height:640px){
body{background:#DCD8CF !important;overflow:hidden}
body::before{content:"";position:fixed;inset:0;margin:auto;width:424px;height:min(844px,calc(100vh - 56px));pointer-events:none;background:linear-gradient(#2B3331,#2B3331) left 0 top 112px/4px 32px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 170px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 246px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) right 0 top 196px/4px 98px no-repeat}
body::after{content:"";position:fixed;left:50%;bottom:calc((100vh - min(844px,calc(100vh - 56px))) / 2 + 8px);width:134px;height:5px;margin-left:-67px;border-radius:999px;background:#16201E;z-index:20;pointer-events:none}
div:has(> [data-statusbar]){position:fixed !important;inset:0 !important;margin:auto !important;height:min(844px,calc(100vh - 56px)) !important;min-height:0 !important;overflow-x:hidden !important;overflow-y:auto !important;border-radius:54px;box-shadow:0 0 0 11px #16201E,0 0 0 13px #4A5250,0 30px 80px rgba(22,32,30,0.35);scrollbar-width:none}
div:has(> [data-statusbar])::-webkit-scrollbar{display:none}
div:has(> [data-statusbar]) > *{flex-shrink:0 !important}
[data-statusbar]{display:flex;order:-1;margin-top:0 !important}
div:has(> [data-statusbar]){padding-top:0 !important}
nav[aria-label="Main menu"]{padding-bottom:26px !important}
[data-overlay]{position:fixed !important;inset:0 !important;margin:auto;width:390px;height:min(844px,calc(100vh - 56px));border-radius:54px;overflow:hidden;z-index:30}
}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: 40px 20px 32px; display: flex; flex-direction: column; align-items: center; gap: 22px; background: #B83A26; color: #FFFFFF; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; text-align: center; overflow-x: clip">


<div style="display: flex; align-items: center; gap: 14px; padding: 10px 24px 10px 10px; border-radius: 999px; background: #FFFFFF; color: #B83A26">
<span style="width: 60px; height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #B83A26; color: #FFFFFF"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path><path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path><path d="M12.6 19.4A2 2 0 1 0 14 16H2"></path></svg></span>
<span style="font-size: 28px; line-height: 34px; font-weight: 700">Can't breathe</span>
</div>

<sc-if value="{{counting}}" hint-placeholder-val="{{true}}">
<div role="timer" aria-label="{{timerLabel}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="font-size: 30px; line-height: 36px; font-weight: 700">Calling 995 in</span>
<div style="position: relative; width: 248px; height: 248px">
<svg width="248" height="248" viewBox="0 0 248 248" aria-hidden="true" style="display: block; transform: rotate(-90deg)"><circle cx="124" cy="124" r="110" fill="none" stroke="#8E2C1C" stroke-width="18"></circle><circle cx="124" cy="124" r="110" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-dasharray="691.15" style="{{ringStyle}}"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 128px; line-height: 124px; font-weight: 700; letter-spacing: -0.04em">{{n}}</span>
<span style="font-size: 28px; line-height: 32px; font-weight: 700">{{unit}}</span>
</div>
</div>
<span aria-live="assertive" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{timerLabel}}</span>
</div>
<button type="button" onClick="{{cancel}}" style="width: 100%; min-height: 144px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 40px; border: 0; background: #FFFFFF; color: #16201E; box-shadow: 0 0 0 8px rgba(255,255,255,0.3), 0 16px 32px rgba(22,32,30,0.3)"><span style="display: flex; align-items: center; gap: 14px; font-size: 48px; line-height: 54px; font-weight: 700"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>Cancel</span><span style="font-size: 21px; line-height: 26px; font-weight: 600; color: #4A4F49">Don't call 995</span></button>
<div style="flex: 1"></div>
<a href="EmergencyCall.dc.html" style="width: 100%; min-height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 3px solid #FFFFFF; color: #FFFFFF; text-decoration: none; font-size: 22px; font-weight: 700">Call now — don't wait</a>
</sc-if>

<sc-if value="{{calling}}" hint-placeholder-val="{{false}}">
<span style="font-size: 34px; line-height: 42px; font-weight: 700">Calling 995 now</span>
<svg role="img" aria-label="Warning" width="168" height="150" viewBox="0 0 24 21.5" style="flex-shrink: 0; display: block"><path d="M10.27 1.5a2 2 0 0 1 3.46 0l9.5 16.5a2 2 0 0 1-1.73 3H2.5a2 2 0 0 1-1.73-3z" fill="#FFFFFF"></path><path d="M12 6.5v6.5" stroke="#B83A26" stroke-width="2.6" stroke-linecap="round"></path><circle cx="12" cy="17" r="1.6" fill="#B83A26"></circle></svg><div style="flex: 1"></div>
<a href="EmergencyCall.dc.html" style="width: 100%; min-height: 104px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #16201E; text-decoration: none; font-size: 28px; font-weight: 700">Open the call</a>
</sc-if>

<sc-if value="{{cancelled}}" hint-placeholder-val="{{false}}">
<span style="font-size: 34px; line-height: 42px; font-weight: 700">Call cancelled</span>
<span style="font-size: 24px; line-height: 34px">No one was called. If you feel worse, press SOS again.</span>
<div style="flex: 1"></div>
<button type="button" onClick="{{restart}}" style="width: 100%; min-height: 88px; border-radius: 999px; border: 3px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 26px; font-weight: 700">I need help — call 995</button>
<a href="Main.dc.html" style="width: 100%; min-height: 88px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #16201E; text-decoration: none; font-size: 26px; font-weight: 700">I'm OK — go home</a>
</sc-if>
<div data-statusbar="true" aria-hidden="true" style="position: sticky; top: 0; z-index: 6; align-self: stretch; margin: -40px -20px -6px; height: 54px; padding: 0 22px; box-sizing: border-box; align-items: center; justify-content: space-between; background: #B83A26; color: #FFFFFF; font-size: 17px; line-height: 22px; font-weight: 600"><span style="width: 92px; text-align: center">9:41</span><span style="width: 124px; height: 36px; border-radius: 999px; background: #000000"></span><span style="width: 92px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4.2 7.1a5.6 5.6 0 0 1 7.6 0"></path><circle cx="8" cy="10.2" r="1.4" fill="currentColor" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity="0.45"></rect><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity="0.45"></path></svg></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seconds":{"editor":"int","default":10,"min":3,"max":30,"unit":"s"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  total() { const v = this.props.seconds; return v >= 3 && v <= 30 ? v : 10; }
  constructor(p) { super(p); this.state = { n: (p.seconds >= 3 && p.seconds <= 30 ? p.seconds : 10), mode: 'count' }; }
  componentDidMount() { this.start(); }
  componentWillUnmount() { clearInterval(this.timer); }
  start() {
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      if (this.state.mode !== 'count') return;
      if (this.state.n <= 1) { clearInterval(this.timer); this.setState({ n: 0, mode: 'calling' }); }
      else this.setState({ n: this.state.n - 1 });
    }, 1000);
  }
  renderVals() {
    const m = this.state.mode, n = this.state.n, C = 691.15;
    return {
      n,
      unit: n === 1 ? 'second' : 'seconds',
      timerLabel: 'Calling 995 in ' + n + (n === 1 ? ' second' : ' seconds') + '. Press Cancel to stop.',
      ringStyle: { strokeDashoffset: (C * (1 - n / this.total())).toFixed(1), transition: 'stroke-dashoffset 1s linear' },
      counting: m === 'count', calling: m === 'calling', cancelled: m === 'cancelled',
      cancel: () => { clearInterval(this.timer); this.setState({ mode: 'cancelled' }); },
      restart: () => { this.setState({ n: this.total(), mode: 'count' }); this.start(); }
    };
  }
}
</script>
</body>
</html>
