<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ventra — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F3EE}
a{color:#1F6FB2}a:hover{color:#175A92}
button,input{font-family:inherit}
button{cursor:pointer}
[data-statusbar]{display:none}
@media (min-width:560px) and (min-height:640px){
body{background:#DCD8CF !important;overflow:hidden}
body::before{content:"";position:fixed;inset:0;margin:auto;width:424px;height:min(844px,calc(100vh - 56px));pointer-events:none;background:linear-gradient(#2B3331,#2B3331) left 0 top 112px/4px 32px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 170px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 246px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) right 0 top 196px/4px 98px no-repeat}
body::after{content:"";position:fixed;left:50%;bottom:calc((100vh - min(844px,calc(100vh - 56px))) / 2 + 8px);width:134px;height:5px;margin-left:-67px;border-radius:999px;background:#16201E;z-index:20;pointer-events:none}
div:has(> [data-statusbar]){position:fixed !important;inset:0 !important;margin:auto !important;height:min(844px,calc(100vh - 56px)) !important;min-height:0 !important;overflow-x:hidden !important;overflow-y:auto !important;border-radius:54px;box-shadow:0 0 0 11px #16201E,0 0 0 13px #4A5250,0 30px 80px rgba(22,32,30,0.35);scrollbar-width:none}
div:has(> [data-statusbar])::-webkit-scrollbar{display:none}
div:has(> [data-statusbar]) > *{flex-shrink:0 !important}
[data-statusbar]{display:flex;order:-1;margin-top:0 !important}
div:has(> [data-statusbar]){padding-top:0 !important}
nav[aria-label="Main menu"]{padding-bottom:26px !important}
[data-overlay]{position:fixed !important;inset:0 !important;margin:auto;width:390px;height:min(844px,calc(100vh - 56px));border-radius:54px;overflow:hidden;z-index:30}
}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 22px; background: #F5F3EE; color: #16201E; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow-x: clip">

<header style="display: flex; align-items: center; gap: 14px">
<a href="Welcome.dc.html" aria-label="Back" style="width: 64px; height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #16201E; border: 2.5px solid #16201E"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="display: flex; align-items: center; gap: 10px; font-size: 24px; line-height: 30px; font-weight: 700"><span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #7CC7FE; color: #16201E"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.2 12h5.3l1.5-3 3 6 1.5-3h6.3"></path></svg></span>Ventra</span>
</header>

<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 38px; line-height: 44px; font-weight: 700; letter-spacing: -0.02em">Welcome back</h1>
<p style="margin: 0; font-size: 22px; line-height: 32px">Log in with your phone number. We'll text you a code.</p>
</div>

<sc-if value="{{askPhone}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 24px; background: #FFFFFF">
<label for="lphone" style="font-size: 22px; line-height: 28px; font-weight: 700">Phone number</label>
<div style="display: flex; align-items: center; gap: 10px">
<span style="height: 72px; padding: 0 16px; flex-shrink: 0; display: flex; align-items: center; border-radius: 14px; background: #ECE9E2; font-size: 24px; font-weight: 700">+65</span>
<input id="lphone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="9123 4567" style="flex: 1; min-width: 0; height: 72px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; border: 2.5px solid #16201E; background: #FFFFFF; color: #16201E; font-size: 26px; font-weight: 600">
</div>
</div>
<button type="button" onClick="{{sendCode}}" style="height: 80px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; border: 0; background: #7CC7FE; color: #16201E; font-size: 26px; font-weight: 700"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Send me a code</button>
</sc-if>

<sc-if value="{{askCode}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 24px; background: #FFFFFF">
<span style="font-size: 22px; line-height: 28px; font-weight: 700">Your 6-digit code</span>
<div role="img" aria-label="Code 4 8 2 9 1 3" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
<span style="height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2.5px solid #16201E; background: #E3F2FF; font-size: 30px; font-weight: 700">{{d.n}}</span>
</sc-for>
</div>
<span style="display: flex; align-items: center; gap: 8px; font-size: 19px; line-height: 26px; font-weight: 600; color: #1B6F45"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Filled in from your text message</span>
</div>
<a href="Main.dc.html" style="height: 80px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; background: #7CC7FE; color: #16201E; text-decoration: none; font-size: 26px; font-weight: 700">Log in<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
<button type="button" onClick="{{changeNumber}}" style="min-height: 56px; border: 0; background: transparent; color: #1F6FB2; font-size: 21px; font-weight: 700; text-decoration: underline">Use a different number</button>
</sc-if>

<div style="flex: 1"></div>

<div style="display: flex; align-items: center; gap: 12px; color: #5B605A; font-size: 19px; line-height: 24px; font-weight: 600"><span style="flex: 1; height: 2px; background: #E3DFD6"></span>New to Ventra?<span style="flex: 1; height: 2px; background: #E3DFD6"></span></div>
<a href="SignUp.dc.html" style="height: 76px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2.5px solid #16201E; background: #FFFFFF; color: #16201E; text-decoration: none; font-size: 24px; font-weight: 700">Create an account</a>

<div style="display: flex; gap: 12px; padding: 16px 18px; border-radius: 20px; background: #E3F2FF">
<svg style="flex-shrink: 0; color: #1F6FB2" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 19px; line-height: 27px">Need help? A nurse or family member can log in with you.</p>
</div>
<div data-statusbar="true" aria-hidden="true" style="position: sticky; top: 0; z-index: 6; align-self: stretch; margin: -28px -20px -6px; height: 54px; padding: 0 22px; box-sizing: border-box; align-items: center; justify-content: space-between; background: #F5F3EE; color: #16201E; font-size: 17px; line-height: 22px; font-weight: 600"><span style="width: 92px; text-align: center">9:41</span><span style="width: 124px; height: 36px; border-radius: 999px; background: #000000"></span><span style="width: 92px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4.2 7.1a5.6 5.6 0 0 1 7.6 0"></path><circle cx="8" cy="10.2" r="1.4" fill="currentColor" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity="0.45"></rect><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity="0.45"></path></svg></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 'phone' }; }
  renderVals() {
    const code = this.state.step === 'code';
    return {
      askPhone: !code, askCode: code,
      sendCode: () => this.setState({ step: 'code' }),
      changeNumber: () => this.setState({ step: 'phone' }),
      digits: '482913'.split('').map((n) => ({ n }))
    };
  }
}
</script>
</body>
</html>
