<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ventra — Type my weight</title>
<script src="./support.js"></script>
<script src="./ventra-record.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F3EE}
a{color:#1F6FB2}a:hover{color:#175A92}
button{font-family:inherit;cursor:pointer}
[data-statusbar]{display:none}
@media (min-width:560px) and (min-height:640px){
body{background:#DCD8CF !important;overflow:hidden}
body::before{content:"";position:fixed;inset:0;margin:auto;width:424px;height:min(844px,calc(100vh - 56px));pointer-events:none;background:linear-gradient(#2B3331,#2B3331) left 0 top 112px/4px 32px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 170px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 246px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) right 0 top 196px/4px 98px no-repeat}
body::after{content:"";position:fixed;left:50%;bottom:calc((100vh - min(844px,calc(100vh - 56px))) / 2 + 8px);width:134px;height:5px;margin-left:-67px;border-radius:999px;background:#16201E;z-index:20;pointer-events:none}
div:has(> [data-statusbar]){position:fixed !important;inset:0 !important;margin:auto !important;height:min(844px,calc(100vh - 56px)) !important;min-height:0 !important;overflow-x:hidden !important;overflow-y:auto !important;border-radius:54px;box-shadow:0 0 0 11px #16201E,0 0 0 13px #4A5250,0 30px 80px rgba(22,32,30,0.35);scrollbar-width:none}
div:has(> [data-statusbar])::-webkit-scrollbar{display:none}
div:has(> [data-statusbar]) > *{flex-shrink:0 !important}
[data-statusbar]{display:flex;order:-1;margin-top:0 !important}
div:has(> [data-statusbar]){padding-top:0 !important}
nav[aria-label="Main menu"]{padding-bottom:26px !important}
[data-overlay]{position:fixed !important;inset:0 !important;margin:auto;width:390px;height:min(844px,calc(100vh - 56px));border-radius:54px;overflow:hidden;z-index:30}
}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 20px; background: #F5F3EE; color: #16201E; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow-x: clip">

<header style="display: flex; align-items: center; gap: 12px">
<a href="WeighHow.dc.html" aria-label="Back" style="width: 64px; height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #16201E; border: 2.5px solid #16201E"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em">What does the scale say?</h1>
<a href="EmergencyChoose.dc.html" aria-label="SOS — get emergency help" style="height: 64px; padding: 0 16px; margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: #B83A26; color: #FFFFFF; text-decoration: none; font-size: 21px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>SOS</a>
</header>

<section aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px; border-radius: 32px; background: #FFFFFF; border: 4px solid #16201E">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="{{numStyle}}">{{shown}}</span>
<span style="font-size: 32px; font-weight: 700">kg</span>
</div>
<span style="font-size: 20px; line-height: 28px; color: #5B605A">Yesterday: {{yText}}</span>
</section>

<sc-if value="{{warn}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 12px; padding: 16px; border-radius: 20px; background: #FDF2D8; border: 3px solid #8A5B00">
<svg style="flex-shrink: 0; color: #8A5B00" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
<p style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">That's 2 kg or more away from yesterday. Please check the number, then save.</p>
</div>
</sc-if>

<div role="group" aria-label="Number keypad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="min-height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 20px; border: 2.5px solid #16201E; background: #FFFFFF; color: #16201E; font-size: 36px; font-weight: 700">{{k.label}}</button>
</sc-for>
</div>

<sc-if value="{{canSave}}" hint-placeholder-val="{{true}}">
<a href="{{saveHref}}" style="min-height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #7CC7FE; color: #16201E; text-decoration: none; font-size: 26px; font-weight: 700">Save my weight</a>
</sc-if>
<sc-if value="{{cantSave}}" hint-placeholder-val="{{false}}">
<span style="min-height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #ECE9E2; color: #5B605A; font-size: 24px; font-weight: 700">Type your weight first</span>
</sc-if>
<div data-statusbar="true" aria-hidden="true" style="position: sticky; top: 0; z-index: 6; align-self: stretch; margin: -28px -20px -4px; height: 54px; padding: 0 22px; box-sizing: border-box; align-items: center; justify-content: space-between; background: #F5F3EE; color: #16201E; font-size: 17px; line-height: 22px; font-weight: 600"><span style="width: 92px; text-align: center">9:41</span><span style="width: 124px; height: 36px; border-radius: 999px; background: #000000"></span><span style="width: 92px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4.2 7.1a5.6 5.6 0 0 1 7.6 0"></path><circle cx="8" cy="10.2" r="1.4" fill="currentColor" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity="0.45"></rect><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity="0.45"></path></svg></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { buf: '58.6' }; }
  press(k) {
    let b = this.state.buf;
    if (k === 'del') b = b.slice(0, -1);
    else if (k === '.') { if (!b.includes('.') && b.length) b += '.'; }
    else {
      const dot = b.indexOf('.');
      if (dot >= 0 && b.length - dot > 1) return;
      if (dot < 0 && b.length >= 3) return;
      b += k;
    }
    this.setState({ buf: b });
  }
  renderVals() {
    const b = this.state.buf;
    const R = window.VentraRecord; const Y = R ? R.weight(R.yesterday) : 0;
    const v = parseFloat(b);
    const ok = !isNaN(v) && v >= 25 && v <= 250;
    const keys = ['1','2','3','4','5','6','7','8','9','.','0','del'].map((k) => ({
      label: k === 'del' ? '⌫' : k,
      aria: k === 'del' ? 'Delete' : k === '.' ? 'Decimal point' : k,
      press: () => this.press(k)
    }));
    return {
      keys, shown: b || '—',
      numStyle: { fontSize: '76px', lineHeight: '84px', fontWeight: 700, letterSpacing: '-0.03em', color: b ? '#16201E' : '#8C877B' },
      warn: ok && Math.abs(v - Y) >= (R ? R.targets.alertGainKg : 2), yText: R ? R.fmt.kg(Y) : '',
      saveHref: ok && v - Y >= (R ? R.targets.alertGainKg : 2) ? 'YellowAlert.dc.html' : 'Weight.dc.html',
      canSave: ok, cantSave: !ok
    };
  }
}
</script>
</body>
</html>
