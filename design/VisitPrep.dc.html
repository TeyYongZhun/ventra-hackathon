<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ventra — Doctor visit prep</title>
<script src="./support.js"></script>
<script src="./ventra-record.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F3EE}
a{color:#1F6FB2}a:hover{color:#175A92}
button{font-family:inherit;cursor:pointer}
[data-statusbar]{display:none}
@media (min-width:560px) and (min-height:640px){
body{background:#DCD8CF !important;overflow:hidden}
body::before{content:"";position:fixed;inset:0;margin:auto;width:424px;height:min(844px,calc(100vh - 56px));pointer-events:none;background:linear-gradient(#2B3331,#2B3331) left 0 top 112px/4px 32px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 170px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) left 0 top 246px/4px 62px no-repeat,linear-gradient(#2B3331,#2B3331) right 0 top 196px/4px 98px no-repeat}
body::after{content:"";position:fixed;left:50%;bottom:calc((100vh - min(844px,calc(100vh - 56px))) / 2 + 8px);width:134px;height:5px;margin-left:-67px;border-radius:999px;background:#16201E;z-index:20;pointer-events:none}
div:has(> [data-statusbar]){position:fixed !important;inset:0 !important;margin:auto !important;height:min(844px,calc(100vh - 56px)) !important;min-height:0 !important;overflow-x:hidden !important;overflow-y:auto !important;border-radius:54px;box-shadow:0 0 0 11px #16201E,0 0 0 13px #4A5250,0 30px 80px rgba(22,32,30,0.35);scrollbar-width:none}
div:has(> [data-statusbar])::-webkit-scrollbar{display:none}
div:has(> [data-statusbar]) > *{flex-shrink:0 !important}
[data-statusbar]{display:flex;order:-1;margin-top:0 !important}
div:has(> [data-statusbar]){padding-top:0 !important}
nav[aria-label="Main menu"]{padding-bottom:26px !important}
[data-overlay]{position:fixed !important;inset:0 !important;margin:auto;width:390px;height:min(844px,calc(100vh - 56px));border-radius:54px;overflow:hidden;z-index:30}
}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 22px; background: #F5F3EE; color: #16201E; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; overflow-x: clip">

<header style="display: flex; align-items: center; gap: 12px">
<a href="Calendar.dc.html" aria-label="Back to calendar" style="width: 64px; height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #16201E; border: 2.5px solid #16201E"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.02em">For my doctor</h1>
<a href="EmergencyChoose.dc.html" aria-label="SOS — get emergency help" style="height: 64px; padding: 0 16px; margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: #B83A26; color: #FFFFFF; text-decoration: none; font-size: 21px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>SOS</a>
</header>

<div style="display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 24px; background: #7CC7FE; color: #16201E">
<div style="width: 72px; height: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; background: #FFFFFF; color: #1F6FB2"><span style="font-size: 17px; font-weight: 700">TUE</span><span style="font-size: 34px; line-height: 38px; font-weight: 700">13</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; line-height: 30px; font-weight: 700">Heart clinic</span><span style="font-size: 20px; line-height: 28px">10:30 AM · Dr Lim</span></div>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; background: #FDF2D8">
<span style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #F8DA98"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M7.5 10a6 6 0 0 1 9 0"></path><path d="m12 10 1.6-2.2"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">{{wHead}}</span><span style="font-size: 19px; line-height: 26px">{{wSub}}</span></span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; background: #E6F0FB">
<span style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #B7D5F4"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7z"></path></svg></span>

</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; background: #FDE5DD">
<span style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #F2785C"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"></path><path d="m8.5 8.5 7 7"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">Medicine</span><span style="font-size: 19px; line-height: 26px">{{medSub}}</span></span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 24px; background: #FFFFFF">
<span style="width: 56px; height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #ECE9E2"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 15h8"></path><path d="M9 9h.01"></path><path d="M15 9h.01"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">How I felt</span><span style="font-size: 19px; line-height: 26px">{{feltSub}}</span></span>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 24px; background: #FFFFFF">
<h2 style="margin: 0 0 8px; font-size: 28px; line-height: 34px; font-weight: 700">Questions to ask</h2>
<sc-for list="{{qs}}" as="q" hint-placeholder-count="3">
<button type="button" role="checkbox" aria-checked="{{q.on}}" onClick="{{q.toggle}}" style="min-height: 84px; display: flex; align-items: center; gap: 14px; padding: 10px 0; border: 0; border-top: 2px solid #E3DFD6; background: #FFFFFF; color: #16201E; text-align: left">
<span style="{{q.box}}"><sc-if value="{{q.on}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16201E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
<span style="flex: 1; font-size: 21px; line-height: 29px; font-weight: 600">{{q.text}}</span>
</button>
</sc-for>
<button type="button" style="height: 64px; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; border: 2.5px solid #16201E; background: #FFFFFF; color: #16201E; font-size: 21px; font-weight: 700"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Add my own question</button>
</section>

<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" style="height: 76px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; border: 0; background: #8D93F6; color: #16201E; font-size: 24px; font-weight: 700"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>Read aloud</button>
<button type="button" style="height: 76px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; border: 0; background: #7CC7FE; color: #16201E; font-size: 24px; font-weight: 700"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.59 13.51 6.83 3.98"></path><path d="m15.41 6.51-6.82 3.98"></path></svg>Send to doctor or family</button>
<button type="button" style="height: 76px; display: flex; align-items: center; justify-content: center; gap: 12px; border-radius: 999px; border: 2.5px solid #16201E; background: #FFFFFF; color: #16201E; font-size: 24px; font-weight: 700"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>Print</button>
</div>

<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 76px; border-radius: 20px; text-decoration: none; font-size: 15px; font-weight: 700; color: #16201E"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span>Home</span></a>
<a href="Fluid.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 76px; border-radius: 20px; text-decoration: none; font-size: 15px; font-weight: 700; color: #16201E"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg><span>Track</span></a>
<a href="Talk.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 76px; border-radius: 20px; text-decoration: none; font-size: 15px; font-weight: 700; color: #16201E"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg><span>Ask AI</span></a>

</nav>
<div data-statusbar="true" aria-hidden="true" style="position: sticky; top: 0; z-index: 6; align-self: stretch; margin: -28px -20px -6px; height: 54px; padding: 0 22px; box-sizing: border-box; align-items: center; justify-content: space-between; background: #F5F3EE; color: #16201E; font-size: 17px; line-height: 22px; font-weight: 600"><span style="width: 92px; text-align: center">9:41</span><span style="width: 124px; height: 36px; border-radius: 999px; background: #000000"></span><span style="width: 92px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4.2 7.1a5.6 5.6 0 0 1 7.6 0"></path><circle cx="8" cy="10.2" r="1.4" fill="currentColor" stroke="none"></circle></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="none" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" opacity="0.45"></rect><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="currentColor"></rect><path d="M25 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity="0.45"></path></svg></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2300}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { 0: true, 1: true, 2: false } }; }
  componentDidMount() { if (!window.VentraRecord) { this._vr = setInterval(() => { if (window.VentraRecord) { clearInterval(this._vr); this.forceUpdate(); } }, 50); } }
  renderVals() {
    const R = window.VentraRecord; if (!R) return {};
    const F = R.fmt, a = R.adherence(), fd = R.fluidDaysOk(), miss = R.missedIn();
    const texts = R.questions();
    const byMed = {}; miss.forEach((m) => { byMed[m.med] = (byMed[m.med] || 0) + 1; });
    const missTxt = Object.keys(byMed).map((id) => byMed[id] + ' ' + R.med(id).name.toLowerCase() + (byMed[id] > 1 ? 's' : '') + ' missed' + (miss[0].why ? ' when ' + miss[0].why : '')).join(' · ');
    const dd = R.weightToday - R.dischargeWeight;
    const ank = R.symptomDays('ankles').length, tir = R.symptomDays('tired').length;
    const qs = texts.map((text, i) => {
      const on = !!this.state.on[i];
      return { text, on, toggle: () => this.setState({ on: { ...this.state.on, [i]: !on } }),
        box: { width: '48px', height: '48px', flexShrink: 0, boxSizing: 'border-box', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '12px', background: on ? '#7CC7FE' : '#FFFFFF', border: '3px solid #16201E' } };
    });
    return { qs,
      periodText: R.dayLong(R.data.period.from) + ' to today · weight since you left hospital',
      wHead: Math.abs(R.weightChange(3)) < 1 ? 'Weight steady' : 'Weight changing',
      wSub: (dd <= 0 ? 'Down ' : 'Up ') + Math.abs(dd).toFixed(1) + ' kg since hospital: ' + F.kg(R.dischargeWeight) + ' → ' + F.kg(R.weightToday),
      fluidSub: 'Under limit ' + fd.ok + ' of ' + fd.of + ' days',
      medSub: a.text + ' doses taken' + (missTxt ? ' · ' + missTxt : ''),
      feltSub: 'Swollen ankles ' + ank + ' day' + (ank === 1 ? '' : 's') + ' · tired ' + tir + ' day' + (tir === 1 ? '' : 's') };
  }
}
</script>
</body>
</html>
